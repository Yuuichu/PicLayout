appId: com.yuui.piclayout
productName: Frameverse
copyright: © Yuui's Frameverse

directories:
  output: ../dist-electron
  buildResources: build

files:
  - out/**/*

win:
  artifactName: Frameverse Setup ${version}.${ext}
  icon: build/icon.ico
  extraResources:
    - from: ../rust-core/target/release/rust-core.exe
      to: rust-core.exe
    - from: build/icon.png
      to: icon.png
  target:
    - target: nsis
      arch: x64

mac:
  artifactName: Frameverse-${version}-${arch}.${ext}
  icon: build/icon.png
  category: public.app-category.photography
  minimumSystemVersion: '12.0'
  binaries:
    - Contents/Resources/rust-core
  extraResources:
    - from: ../rust-core/target/release/rust-core
      to: rust-core
    - from: build/icon.png
      to: icon.png
  target:
    - dmg
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Frameverse
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
