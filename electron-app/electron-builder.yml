appId: com.yuui.piclayout
productName: PicLayout
copyright: © Yuui's PicLayoutTool

directories:
  output: ../dist-electron
  buildResources: build

# 将编译好的 Rust 可执行文件捆绑进安装包
extraResources:
  - from: ../rust-core/target/release/rust-core.exe
    to: rust-core.exe

files:
  - dist/**/*

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: PicLayout
