appId: com.yuui.piclayout
productName: Frameverse
artifactName: Frameverse Setup ${version}.${ext}
copyright: © Yuui's Frameverse

directories:
  output: ../dist-electron
  buildResources: build

files:
  - out/**/*

win:
  icon: build/icon.ico
  extraResources:
    - from: build/sidecar/rust-core.exe
      to: rust-core.exe
    - from: build/icon.png
      to: icon.png
  target:
    - target: nsis
      arch: x64

mac:
  artifactName: Frameverse-${version}-macOS-${arch}.${ext}
  category: public.app-category.photography
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  binaries:
    - Contents/Resources/rust-core
  extraResources:
    - from: build/sidecar/rust-core
      to: rust-core
    - from: build/icon.png
      to: icon.png
  target:
    - dmg
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Frameverse
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
