appId: com.yuui.piclayout
productName: Frameverse
artifactName: Frameverse Setup ${version}.${ext}
copyright: © Yuui's Frameverse

directories:
  output: ../dist-electron
  buildResources: build

extraResources:
  - from: ../rust-core/target/release/rust-core.exe
    to: rust-core.exe
  - from: build/icon.png
    to: icon.png

files:
  - out/**/*

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Frameverse
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
